# OpenSearch 2.x — 2-node cluster + Dashboards (main project cluster)
services:
  opensearch-node1:
    image: opensearchproject/opensearch:2.19.1
    container_name: os-node1
    environment:
      - cluster.name=product-search
      - node.name=opensearch-node1
      - discovery.seed_hosts=opensearch-node1,opensearch-node2
      - cluster.initial_cluster_manager_nodes=opensearch-node1,opensearch-node2
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=StrongPass123!
      - path.repo=/usr/share/opensearch/snapshots
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - os-data1:/usr/share/opensearch/data
      - ./snapshots:/usr/share/opensearch/snapshots
    ports:
      - 9200:9200
      - 9600:9600
    networks:
      - os-net

  opensearch-node2:
    image: opensearchproject/opensearch:2.19.1
    container_name: os-node2
    environment:
      - cluster.name=product-search
      - node.name=opensearch-node2
      - discovery.seed_hosts=opensearch-node1,opensearch-node2
      - cluster.initial_cluster_manager_nodes=opensearch-node1,opensearch-node2
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=StrongPass123!
      - path.repo=/usr/share/opensearch/snapshots
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - os-data2:/usr/share/opensearch/data
      - ./snapshots:/usr/share/opensearch/snapshots
    ports:
      - 9201:9200
      - 9601:9600
    networks:
      - os-net

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.1
    container_name: os-dashboards
    ports:
      - 5601:5601
    environment:
      - OPENSEARCH_HOSTS=["https://opensearch-node1:9200","https://opensearch-node2:9200"]
      - OPENSEARCH_SSL_VERIFICATIONMODE=none
    networks:
      - os-net
    depends_on:
      - opensearch-node1
      - opensearch-node2

volumes:
  os-data1:
  os-data2:

networks:
  os-net:
