# OpenSearch 3.x — single-node cluster + Dashboards (migration TARGET)
# Shares ./snapshots with the v2 cluster so a 2.x snapshot can be restored here.
services:
  opensearch-v3:
    image: opensearchproject/opensearch:3.0.0
    container_name: os-v3
    environment:
      - cluster.name=product-search-v3
      - node.name=opensearch-v3
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=StrongPass123!
      - path.repo=/usr/share/opensearch/snapshots
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - os-data-v3:/usr/share/opensearch/data
      - ./snapshots:/usr/share/opensearch/snapshots
    ports:
      - 9202:9200
      - 9602:9600
    networks:
      - os-net

  opensearch-dashboards-v3:
    image: opensearchproject/opensearch-dashboards:3.0.0
    container_name: os-dashboards-v3
    ports:
      - 5602:5601
    environment:
      - OPENSEARCH_HOSTS=["https://opensearch-v3:9200"]
      - OPENSEARCH_SSL_VERIFICATIONMODE=none
    networks:
      - os-net
    depends_on:
      - opensearch-v3

volumes:
  os-data-v3:

networks:
  os-net:
